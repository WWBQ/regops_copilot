<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>W1 引导式手写清单 · RegOps Copilot</title>
<style>
:root{--ink:#182235;--muted:#657186;--line:#dfe5ed;--bg:#f5f7fa;--panel:#fff;--nav:#111c30;--blue:#2563eb;--bluebg:#eaf1ff;--green:#14825f;--greenbg:#e9f8f1;--amber:#a96308;--amberbg:#fff5df;--red:#b42318;--redbg:#fff0ee;--r:14px;--sh:0 10px 26px rgba(15,23,42,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;box-shadow:0 3px 14px #0003}.toprow{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;flex-wrap:wrap}
.brand b{display:block}.brand small{color:#a9b6ca;font-size:12px}
.prog{display:flex;align-items:center;gap:10px;color:#c9d2df;font-size:13px}.prog b{color:#fff}
.bar{height:8px;width:140px;background:#334155;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#13a77d);transition:width .25s}
.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding:20px}
.side{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh)}
.side h2{font-size:14px;margin:4px 8px 10px;color:var(--muted)}.slink{display:block;width:100%;border:0;background:transparent;text-align:left;color:#46536a;border-radius:8px;padding:8px 10px;margin:2px 0;font-size:14px;cursor:pointer}.slink.on{background:var(--bluebg);color:#184ba6;font-weight:700}.slink:hover{background:#f2f5f9}
.sidefoot{border-top:1px solid var(--line);margin-top:10px;padding:10px 8px;font-size:12px;color:var(--muted)}
main{min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px}
.section{font-size:22px;margin:0 0 10px}.sub{font-size:17px;margin:18px 0 8px;color:#2d3a4f}.muted{color:var(--muted);font-size:14px}.small{font-size:12px;color:var(--muted)}
.call{border-left:4px solid var(--blue);background:var(--bluebg);border-radius:0 10px 10px 0;padding:12px 14px;margin:12px 0}.call.good{border-color:var(--green);background:var(--greenbg)}.call.warn{border-color:var(--amber);background:var(--amberbg)}
.badge{display:inline-block;border-radius:999px;padding:3px 8px;margin:0 4px 4px 0;background:#eef2f7;color:#526076;font-size:11px;font-weight:700}.badge.must{background:var(--redbg);color:var(--red)}.badge.day{background:var(--bluebg);color:#184ba6}.badge.done{background:var(--greenbg);color:var(--green)}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:12px 14px;background:linear-gradient(90deg,#eef2ff,#fff);border:1px solid var(--line);border-radius:10px;border-left:4px solid var(--blue)}
.step{border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden;background:#fff}.step summary{padding:12px 14px;cursor:pointer;font-weight:700;background:#fafbfd;list-style:none;display:flex;align-items:center;gap:10px}.step summary::-webkit-details-marker{display:none}.step summary .num{background:var(--blue);color:#fff;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}.step.done summary .num{background:var(--green)}.step .body{padding:14px 16px;border-top:1px solid var(--line)}
.checkrow{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;margin:8px 0;padding:8px 10px;border-radius:8px}.checkrow:hover{background:#f8fafc}.checkrow input{width:18px;height:18px;margin-top:3px;cursor:pointer}.checkrow.done label{text-decoration:line-through;color:var(--muted)}
.code{font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;background:#111827;color:#e6edf7;padding:12px 14px;border-radius:9px;overflow:auto;font-size:13px;line-height:1.55;margin:10px 0}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;margin:10px 0}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}th{background:var(--bg);font-size:12px;color:#536075}
.tree{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:14px;line-height:1.6;white-space:pre-wrap}
.facts{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin:10px 0;font-size:14px}.facts dt{font-weight:700;color:#49566b}.facts dd{margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tool{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}.tool:hover{background:#f2f5f9}
.flowpipe{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:14px 0}.fstep{flex:1;min-width:120px;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;font-size:13px;line-height:1.45}.fstep b{display:block;font-size:11px;color:var(--blue);margin-bottom:4px;letter-spacing:.03em}.fstep code{font-size:11px;background:#f1f5f9;padding:1px 4px;border-radius:4px}.farr{color:#94a3b8;font-size:18px;align-self:center;flex:0}.flayer{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;background:#fafbfd}.flayer>.lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.footer{text-align:center;font-size:12px;color:var(--muted);padding:8px 16px 24px}
@media(max-width:820px){.layout{display:block;padding:12px}.side{position:relative;top:auto;max-height:none;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}.side h2,.sidefoot{display:none}.slink{width:auto}}
@media print{.top,.side,.tools{display:none!important}.layout{display:block;max-width:none}.panel{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="toprow">
  <div class="brand"><b>W1 引导式手写清单</b><small>RegOps Copilot · python-ai/ · 自己写核心代码 · 环境可借用</small></div>
  <div class="prog">进度 <b id="pct">0%</b><div class="bar"><i id="bar" style="width:0"></i></div></div>
</div></header>
<div class="layout">
<aside class="side" id="side"></aside>
<main id="main"></main>
</div>
<div class="footer">项目路径：<code>/Users/chengfeng/Desktop/AI/regops_copilot</code> · 勾选保存在本机浏览器 · <a href="W2_引导式手写清单.html" style="color:#93c5fd">→ W2 清单</a> · 配合主学习系统 W1 Must 使用</div>
<script>
"use strict";
const KEY="regops-w1-checklist:v1";
const state=load();
const NAV=[
  {id:"intro",label:"怎么用"},
  {id:"flow",label:"数据流图 ⭐"},
  {id:"libs",label:"Python 库"},
  {id:"tree",label:"目录结构"},
  {id:"day1",label:"Day 1 · w1-1"},
  {id:"day2",label:"Day 2 · w1-2"},
  {id:"day3",label:"Day 3 · w1-3"},
  {id:"day4",label:"Day 4 · w1-4"},
  {id:"day5",label:"Day 5 · w1-5"},
  {id:"day6",label:"Day 6 · w1-6"},
  {id:"stuck",label:"卡住怎么办"},
  {id:"refs",label:"文档链接"}
];
const CHECKS=[
  {id:"d0-env",sec:"day1",label:"Step 0：docker compose ps healthy；cp .env.example .env 并填 API Key"},
  {id:"d0-dir",sec:"day1",label:"Step 0：mkdir app/models app/schemas app/api tests；激活 .venv"},
  {id:"d1-config",sec:"day1",label:"Step 1：写完 app/config.py，Settings 能读到环境变量"},
  {id:"d1-base",sec:"day1",label:"Step 2：写完 app/models/base.py 抽象类 + 异常"},
  {id:"d1-deepseek",sec:"day1",label:"Step 3：DeepSeekClient 终端能打出模型回复"},
  {id:"d1-qwen",sec:"day1",label:"Step 4（可选）：QwenClient 或明天补"},
  {id:"d1-report",sec:"day1",label:"Step 5：docs/model_selection_w1.md 质量/延迟/Token 三列"},
  {id:"d1-must",sec:"day1",label:"主学习系统勾选 w1-1"},
  {id:"d2-schema",sec:"day2",label:"写完 app/schemas/compliance.py 合规 DTO"},
  {id:"d2-test",sec:"day2",label:"tests/test_schemas.py 至少 5 合法 + 5 非法"},
  {id:"d2-must",sec:"day2",label:"pytest 全绿；主系统勾选 w1-2"},
  {id:"d3-main",sec:"day3",label:"app/main.py + api/health chat models 三个路由"},
  {id:"d3-test",sec:"day3",label:"tests/test_api.py Mock LLM，断网可测"},
  {id:"d3-run",sec:"day3",label:"uvicorn 启动；curl /health /chat；/docs 可打开"},
  {id:"d3-must",sec:"day3",label:"pytest 全绿；主系统勾选 w1-3"},
  {id:"d4-dir",sec:"day4",label:"Step 0：建好 eval/golden eval/reports eval/scripts 目录"},
  {id:"d4-golden",sec:"day4",label:"Step 1：30 条黄金集 JSON（15 条款 + 15 数字）带来源日期"},
  {id:"d4-script",sec:"day4",label:"Step 2：eval/run_w1_chat.py 可复跑，固定 temperature=0"},
  {id:"d4-report",sec:"day4",label:"Step 3：报告含正确/错误/拒答/数字错误率/P50/P95/Token"},
  {id:"d4-doc",sec:"day4",label:"Step 4：docs/eval_w1_baseline.md 说明与公开基准分工"},
  {id:"d4-must",sec:"day4",label:"主系统勾选 w1-4"},
  {id:"d5-data",sec:"day5",label:"docs/DATA_SOURCES.md 公开数据源与使用边界"},
  {id:"d5-readme",sec:"day5",label:"README 首屏：非机构生产系统 + 基于公开披露数据"},
  {id:"d5-api",sec:"day5",label:"docs/api-spec.md 或导出 OpenAPI；Python/Java 边界"},
  {id:"d5-must",sec:"day5",label:"主系统勾选 w1-5"},
  {id:"d6-cards",sec:"day6",label:"docs/benchmarks/ 五张选型卡 + 许可说明"},
  {id:"d6-script",sec:"day6",label:"eval/scripts/ 只放下载脚本，不提交基准原数据"},
  {id:"d6-must",sec:"day6",label:"能口述「管线回归 vs 能力宣称」；勾选 w1-6"},
  {id:"pip",sec:"libs",label:"pip install 完成并写入 requirements.txt"}
];
let route=location.hash.slice(1)||"intro";

function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderProgress()}
function isDone(id){return!!state[id]}
function toggle(id){state[id]=!state[id];save();render()}
function renderProgress(){
  const n=CHECKS.filter(c=>isDone(c.id)).length;
  const p=CHECKS.length?Math.round(n/CHECKS.length*100):0;
  document.getElementById("pct").textContent=p+"%";
  document.getElementById("bar").style.width=p+"%";
}
function e(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function check(id,label){
  const d=isDone(id);
  return `<div class="checkrow ${d?"done":""}"><input type="checkbox" id="${id}" ${d?"checked":""} onchange="toggle('${id}')"><label for="${id}">${e(label)}</label></div>`;
}
function checksFor(sec){return CHECKS.filter(c=>c.sec===sec).map(c=>check(c.id,c.label)).join("")}

function renderSide(){
  document.getElementById("side").innerHTML=`<h2>导航</h2>${NAV.map(n=>`<button class="slink ${route===n.id?"on":""}" onclick="go('${n.id}')">${e(n.label)}</button>`).join("")}<div class="sidefoot"><button class="tool" onclick="resetAll()">重置勾选</button><br><br>原则：核心代码自己写；卡住 &gt;30min 再求助</div>`;
}

function go(id){route=id;location.hash=id;render()}
function resetAll(){if(confirm("清除所有勾选？")){Object.keys(state).forEach(k=>delete state[k]);save();render()}}

function intro(){return `
<div class="panel">
  <div class="dayhead"><b>怎么用这份清单</b><span class="badge must">引导式从 0</span></div>
  <div class="call good"><b>原则：</b>ModelClient、DTO、API、pytest <b>自己写</b>；Docker、pgvector、Git、依赖列表可以借用现成配置。</div>
  <dl class="facts">
    <dt>项目路径</dt><dd><code>/Users/chengfeng/Desktop/AI/regops_copilot/python-ai</code></dd>
    <dt>数据库</dt><dd><code>docker compose up -d db</code> · pgvector 已配 · localhost:5432</dd>
    <dt>前端</dt><dd><b>W9 再碰 web/</b> · W1 用 Swagger <code>/docs</code> 当演示 UI</dd>
    <dt>节奏</dt><dd>Day 1–3 Must（ModelClient / DTO / API）· Day 4–6 Must（评测基线 / 合规文档 / 基准选型）</dd>
    <dt>交付标准</dt><dd>代码 + pytest + 简短文档 + 能口述「为什么这样设计」</dd>
  </dl>
  <div class="call warn"><b>2 小时最短路径（今天时间紧）：</b>pip install → config.py → base.py + deepseek.py → 终端跑通一次 chat → 明天补对比表。</div>
  ${checksFor("libs").replace(check("pip","pip install 完成并写入 requirements.txt"),"")}
</div>`}

function libs(){return `
<div class="panel">
  <h2 class="section">Python 库：W1 要用哪些</h2>
  <h3 class="sub">Day 1–3 必装</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>库</th><th>干什么</th><th>哪天的任务</th></tr></thead>
    <tbody>
      <tr><td><code>fastapi</code></td><td>Web 框架，写 /health、/chat</td><td>Day 3</td></tr>
      <tr><td><code>uvicorn[standard]</code></td><td>启动 FastAPI</td><td>Day 3</td></tr>
      <tr><td><code>pydantic</code></td><td>Schema、字段校验</td><td>Day 2</td></tr>
      <tr><td><code>pydantic-settings</code></td><td>从 .env 读 API Key</td><td>Day 1</td></tr>
      <tr><td><code>httpx</code></td><td>异步 HTTP 调 DeepSeek/Qwen</td><td>Day 1</td></tr>
      <tr><td><code>python-dotenv</code></td><td>本地加载 .env（可选）</td><td>Day 1</td></tr>
      <tr><td><code>pytest</code></td><td>跑测试</td><td>Day 2–3</td></tr>
      <tr><td><code>pytest-asyncio</code></td><td>测 async 函数</td><td>Day 3</td></tr>
    </tbody>
  </table></div>
  <h3 class="sub">W1 暂时不用装</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>库</th><th>什么时候装</th></tr></thead>
    <tbody>
      <tr><td><code>sqlalchemy</code> / <code>psycopg</code> / <code>pgvector</code></td><td>W2–W3 连库、RAG</td></tr>
      <tr><td><code>langchain</code> / <code>langgraph</code></td><td>W5–W6</td></tr>
      <tr><td><code>openai</code> SDK</td><td>可选；W1 用 httpx 直调 REST 更好理解</td></tr>
    </tbody>
  </table></div>
  <div class="code">cd /Users/chengfeng/Desktop/AI/regops_copilot/python-ai
source .venv/bin/activate
python --version   # 建议 3.11/3.12；3.14 若装包报错再降版本

pip install fastapi "uvicorn[standard]" pydantic pydantic-settings httpx python-dotenv pytest pytest-asyncio
pip freeze > requirements.txt</div>
  ${check("pip","pip install 完成并写入 requirements.txt")}
</div>`}

function flow(){return `
<div class="panel">
  <h2 class="section">按数据流读 W1 代码</h2>
  <div class="call good"><b>读代码顺序：</b>先跟一条请求从 curl 走到 DeepSeek 再回来；不要按文件夹字母顺序读。</div>
  <p class="muted">三层记忆：<b>入口 api/</b> → <b>编排 schemas + deps</b> → <b>外部 models/</b></p>
</div>

<div class="panel">
  <h3 class="sub">链路 A · POST /chat（核心）</h3>
  <div class="flowpipe">
    <div class="fstep"><b>① 客户端</b>curl / Swagger<br><code>{"message":"..."}</code></div>
    <div class="farr">→</div>
    <div class="fstep"><b>② uvicorn</b>HTTP :8000</div>
    <div class="farr">→</div>
    <div class="fstep"><b>③ main.py</b>路由到 chat.router</div>
    <div class="farr">→</div>
    <div class="fstep"><b>④ api/chat.py</b><code>chat()</code></div>
  </div>
  <div class="flayer"><div class="lbl">在 chat() 内部</div>
    <div class="flowpipe">
      <div class="fstep"><b>校验入参</b><code>schemas/chat.py</code><br>ChatRequest</div>
      <div class="farr">→</div>
      <div class="fstep"><b>读配置</b><code>deps.py</code> → <code>config.py</code><br>.env / 环境变量</div>
      <div class="farr">→</div>
      <div class="fstep"><b>选 Client</b><code>factory.py</code><br>DeepSeek / Qwen</div>
      <div class="farr">→</div>
      <div class="fstep"><b>调模型</b><code>deepseek.py</code><br>httpx → API</div>
    </div>
  </div>
  <div class="flowpipe">
    <div class="fstep"><b>⑤ 解析</b>ChatResult.content</div>
    <div class="farr">→</div>
    <div class="fstep"><b>⑥ 组装</b>ChatResponse<br>reply + disclaimer</div>
    <div class="farr">→</div>
    <div class="fstep"><b>⑦ 返回</b>JSON 给客户端</div>
  </div>
  <div class="code">curl -X POST http://localhost:8000/chat \\
  -H "Content-Type: application/json" \\
  -d '{"message":"什么是审慎监管？"}'</div>
</div>

<div class="panel">
  <h3 class="sub">链路 B · GET /models</h3>
  <div class="flowpipe">
    <div class="fstep"><b>curl</b>/models</div><div class="farr">→</div>
    <div class="fstep"><b>api/models.py</b></div><div class="farr">→</div>
    <div class="fstep"><b>factory.py</b><br>list_available_models()</div><div class="farr">→</div>
    <div class="fstep"><b>config.py</b><br>哪些 Key 非空</div><div class="farr">→</div>
    <div class="fstep"><b>JSON</b>{"available":["deepseek"]}</div>
  </div>
  <p class="small muted">不调 LLM，只读配置。</p>
</div>

<div class="panel">
  <h3 class="sub">链路 C · GET /health</h3>
  <div class="flowpipe">
    <div class="fstep"><b>curl</b>/health</div><div class="farr">→</div>
    <div class="fstep"><b>api/health.py</b></div><div class="farr">→</div>
    <div class="fstep"><b>固定 JSON</b>status: ok</div>
  </div>
  <p class="small muted">W1 未接 DB ping；W2 后可加 database 状态。</p>
</div>

<div class="panel">
  <h3 class="sub">链路 D · pytest Mock（测试）</h3>
  <div class="flowpipe">
    <div class="fstep"><b>test_api.py</b>FakeLLMClient</div><div class="farr">→</div>
    <div class="fstep"><b>override</b>get_llm_client_dep</div><div class="farr">→</div>
    <div class="fstep"><b>POST /chat</b>（无 uvicorn）</div><div class="farr">→</div>
    <div class="fstep"><b>假回复</b>"这是 mock 回复"</div><div class="farr">→</div>
    <div class="fstep"><b>assert</b>不断网、不花钱</div>
  </div>
  <p class="small muted">数据路径与真请求相同，第 ⑤ 步换成 Fake，httpx 不出网。</p>
</div>

<div class="panel">
  <h3 class="sub">配置横切 · .env 怎么进代码</h3>
  <div class="flowpipe">
    <div class="fstep"><b>根目录</b><code>.env</code></div><div class="farr">→</div>
    <div class="fstep"><b>Settings</b><code>config.py</code></div><div class="farr">→</div>
    <div class="fstep"><b>get_settings()</b>@lru_cache</div><div class="farr">→</div>
    <div class="fstep"><b>factory / api</b>各处读取</div>
  </div>
  <div class="call warn">优先级：<b>终端 export 环境变量</b> &gt; .env 文件。改 .env 后需重启 uvicorn；若 export 过旧 Key 会覆盖文件。</div>
</div>

<div class="panel">
  <h3 class="sub">建议阅读顺序（按流，不按文件夹）</h3>
  <div class="tablewrap"><table>
    <thead><tr><th>顺序</th><th>文件</th><th>看什么</th></tr></thead>
    <tbody>
      <tr><td>1</td><td><code>schemas/chat.py</code></td><td>进 / 出数据结构</td></tr>
      <tr><td>2</td><td><code>api/chat.py</code></td><td>请求怎么处理</td></tr>
