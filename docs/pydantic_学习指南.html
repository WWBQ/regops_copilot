<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pydantic 学习指南 · RegOps Copilot</title>
<style>
:root{--ink:#182235;--muted:#657186;--line:#dfe5ed;--bg:#f5f7fa;--panel:#fff;--nav:#1a1a2e;--teal:#0d9488;--tealbg:#ecfdf5;--blue:#2563eb;--bluebg:#eaf1ff;--green:#14825f;--greenbg:#e9f8f1;--amber:#a96308;--amberbg:#fff5df;--r:14px;--sh:0 10px 26px rgba(15,23,42,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--blue)}code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:.92em}
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;box-shadow:0 3px 14px #0003}.toprow{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;flex-wrap:wrap;gap:10px}
.brand b{display:block}.brand small{color:#a9b6ca;font-size:12px}
.prog{font-size:13px;color:#c9d2df}.prog b{color:#fff}
.bar{height:8px;width:120px;background:#334155;border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .25s}
.layout{max-width:1100px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;padding:18px}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--sh)}
.side h2{font-size:13px;margin:4px 8px 8px;color:var(--muted)}.slink{display:block;width:100%;border:0;background:transparent;text-align:left;color:#46536a;border-radius:8px;padding:7px 10px;margin:2px 0;font-size:13px;cursor:pointer}.slink.on{background:var(--tealbg);color:#0f766e;font-weight:700}.slink:hover{background:#f2f5f9}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.section{font-size:21px;margin:0 0 8px}.sub{font-size:16px;margin:16px 0 6px;font-weight:700;color:#334155}
.call{border-left:4px solid var(--teal);background:var(--tealbg);border-radius:0 10px 10px 0;padding:11px 14px;margin:10px 0}.call.good{border-color:var(--green);background:var(--greenbg)}.call.warn{border-color:var(--amber);background:var(--amberbg)}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;margin:0 4px 4px 0;background:#eef2f7;font-size:11px;font-weight:700}
.checkrow{display:grid;grid-template-columns:20px 1fr;gap:8px;margin:6px 0;padding:6px 8px;border-radius:6px}.checkrow.done label{text-decoration:line-through;color:var(--muted)}.checkrow input{margin-top:4px}
.code{font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;background:#111827;color:#e6edf7;padding:12px;border-radius:8px;font-size:13px;line-height:1.55;margin:8px 0;overflow:auto}
.code.out{background:#f8fafc;color:#334155;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--bg);font-size:12px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare>div{border:1px solid var(--line);border-radius:9px;padding:12px}.compare h4{margin:0 0 6px;font-size:14px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}.fbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff}.farr{color:#94a3b8}
.tool{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;margin-top:8px}
.muted{color:var(--muted);font-size:13px}.footer{text-align:center;font-size:12px;color:var(--muted);padding:8px 16px 20px}
@media(max-width:820px){.layout{display:block}.side{position:relative;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}.side h2{display:none}.compare{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="toprow">
  <div class="brand"><b>Pydantic 学习指南</b><small>数据校验 &amp; Settings · 结合 RegOps schemas/</small></div>
  <div class="prog">进度 <b id="pct">0%</b><div class="bar"><i id="bar" style="width:0"></i></div></div>
</div></header>
<div class="layout"><aside class="side" id="side"></aside><main id="main"></main></div>
<div class="footer">
  项目：<code>python-ai/app/schemas/</code> ·
  <a href="pytest_学习指南.html">pytest 指南</a> ·
  <a href="W1_引导式手写清单.html">W1 清单</a> ·
  <a href="面试_工程化笔记.md">面试笔记 Q32–Q34</a>
</div>
<script>
"use strict";
const KEY="pydantic-guide:v1";
const state=JSON.parse(localStorage.getItem(KEY)||"{}");
const NAV=[
  {id:"start",label:"5 分钟入门"},
  {id:"basemodel",label:"BaseModel 基础"},
  {id:"field",label:"Field 约束"},
  {id:"field_val",label:"field_validator"},
  {id:"model_val",label:"model_validator"},
  {id:"settings",label:"BaseSettings"},
  {id:"fastapi",label:"FastAPI 配合"},
  {id:"error",label:"ValidationError"},
  {id:"project",label:"对照本项目"},
  {id:"cheat",label:"速查卡"},
  {id:"practice",label:"动手练习"}
];
const CHECKS=[
  {id:"c1",sec:"start",l:"理解：Pydantic = 带校验的数据类"},
  {id:"c2",sec:"basemodel",l:"能手写最小 BaseModel 并 .model_dump()"},
  {id:"c3",sec:"field",l:"会用 Field(min_length, ge, le, default)"},
  {id:"c4",sec:"field_val",l:"能解释 field_validator 为何 @classmethod"},
  {id:"c5",sec:"model_val",l:"能解释 model_validator(after) 跨字段规则"},
  {id:"c6",sec:"settings",l:"能解释 Settings 读 .env 的路径"},
  {id:"c7",sec:"fastapi",l:"能解释 response_model 干什么"},
  {id:"c8",sec:"project",l:"读过 compliance.py + chat.py 全文"},
  {id:"c9",sec:"practice",l:"完成练习 2：加一条非法 payload 测 pytest"}
];
let route=location.hash.slice(1)||"start";

function save(){localStorage.setItem(KEY,JSON.stringify(state));const n=CHECKS.filter(c=>state[c.id]).length;const p=Math.round(n/CHECKS.length*100);document.getElementById("pct").textContent=p+"%";document.getElementById("bar").style.width=p+"%"}
function chk(id,l){const d=!!state[id];return `<div class="checkrow ${d?"done":""}"><input type="checkbox" ${d?"checked":""} onchange="state['${id}']=this.checked;save();render()"><label>${l}</label></div>`}
function checks(sec){return CHECKS.filter(c=>c.sec===sec).map(c=>chk(c.id,c.l)).join("")}
function go(id){route=id;location.hash=id;render()}
function resetAll(){if(confirm("清除勾选？")){Object.keys(state).forEach(k=>delete state[k]);save();render()}}

const PAGES={
start(){return `<div class="panel">
<h2 class="section">Pydantic 是什么？</h2>
<div class="call good"><b>一句话：</b>Pydantic 用 Python 类描述「数据长什么样」，<b>自动校验类型和规则</b>；不合法就抛 <code>ValidationError</code>，合法就得到可靠的对象。</div>
<div class="compare">
<div><h4>没有 Pydantic</h4><p class="muted">手写 <code>if not message: raise ...</code>、<code>if temperature &gt; 2: ...</code>，散落各处、易漏</p></div>
<div><h4>有 Pydantic</h4><p class="muted">一个 <code>ChatRequest</code> 类集中定义；FastAPI 自动校验 JSON body</p></div>
</div>
<h3 class="sub">RegOps 里两处用法</h3>
<table>
<tr><th>用法</th><th>文件</th><th>干什么</th></tr>
<tr><td><b>Schema / DTO</b></td><td><code>schemas/chat.py</code> · <code>compliance.py</code></td><td>API 入参/出参、合规结论结构</td></tr>
<tr><td><b>Settings</b></td><td><code>config.py</code></td><td>从 <code>.env</code> / 环境变量读配置</td></tr>
</table>
<h3 class="sub">最小例子（终端可试）</h3>
<div class="code">from pydantic import BaseModel, Field

class Demo(BaseModel):
    name: str = Field(..., min_length=1)

Demo(name="RegOps")        # ✅ 通过
Demo(name="")              # ❌ ValidationError</div>
${checks("start")}
</div>`},

basemodel(){return `<div class="panel">
<h2 class="section">BaseModel — 定义数据结构</h2>
<div class="code">from pydantic import BaseModel

class ChatResponse(BaseModel):
    reply: str
    model: str
    disclaimer: str = "本回答由 AI 生成..."   # 有默认值

item = ChatResponse(reply="你好", model="deepseek")
item.reply          # "你好"
item.model_dump()   # → dict，给 JSON 序列化</div>
<h3 class="sub">常用方法</h3>
<table>
<tr><th>方法</th><th>作用</th></tr>
<tr><td><code>Model(**dict)</code></td><td>从字典构造（测试里 <code>ComplianceConclusion(**payload)</code>）</td></tr>
<tr><td><code>.model_dump()</code></td><td>转成 dict（Pydantic v2；v1 叫 <code>.dict()</code>）</td></tr>
<tr><td><code>.model_dump_json()</code></td><td>转成 JSON 字符串</td></tr>
<tr><td><code>Model.model_validate(obj)</code></td><td>从 dict / JSON 解析并校验</td></tr>
</table>
<div class="call"><b>类型注解即 schema：</b><code>reply: str</code> 表示必须是字符串；传数字会 ValidationError。</div>
${checks("basemodel")}
</div>`},

field(){return `<div class="panel">
<h2 class="section">Field — 字段级约束</h2>
<div class="code">from pydantic import BaseModel, Field

class ChatRequest(BaseModel):
    message: str = Field(..., min_length=1, max_length=4000)
    temperature: float = Field(default=0.1, ge=0.0, le=2.0)</div>
<table>
<tr><th>写法</th><th>含义</th></tr>
<tr><td><code>Field(...)</code></td><td>必填（<code>...</code> = 无默认值）</td></tr>
<tr><td><code>Field(default=0.1)</code></td><td>可选，默认 0.1</td></tr>
<tr><td><code>min_length / max_length</code></td><td>字符串或 list 长度</td></tr>
<tr><td><code>ge / le</code></td><td>数字 ≥ / ≤（greater/less equal）</td></tr>
<tr><td><code>default_factory=list</code></td><td>默认可变对象用工厂，勿写 <code>= []</code></td></tr>
</table>
<h3 class="sub">Literal — 枚举固定值</h3>
<div class="code">from typing import Literal

risk_level: Literal["低", "中", "高"]   # 只能是这三个字之一</div>
<p class="muted">见 <code>compliance.py</code>：<code>risk_level: "未知"</code> → ValidationError。</p>
${checks("field")}
</div>`},

field_val(){return `<div class="panel">
<h2 class="section">@field_validator — 单字段清洗 / 规则</h2>
<div class="call"><b>时机：</b>单个字段已有值，但还要 strip、去空、格式统一时用。</div>
<div class="code">@field_validator("clause_refs")
@classmethod
def clause_refs_must_be_non_empty(cls, value: list[str]) -> list[str]:
    cleaned = [item.strip() for item in value if item.strip()]
    if not cleaned:
        raise ValueError("至少提供一条有效条款编号")
    return cleaned   # 返回值写回该字段</div>
<h3 class="sub">为什么是 @classmethod？</h3>
<p>此时<strong>整个模型还没拼完</strong>，只有 <code>clause_refs</code> 这一个值传进来 → 参数是 <code>(cls, value)</code>，没有 <code>self</code>。</p>
<div class="compare">
<div><h4>Field / Literal</h4>类型、长度、枚举</div>
<div><h4>field_validator</h4>清洗、业务规则（去空字符串后至少 1 条）</div>
</div>
${checks("field_val")}
</div>`},

model_val(){return `<div class="panel">
<h2 class="section">@model_validator — 跨字段业务规则</h2>
<div class="code">@model_validator(mode="after")
def high_risk_should_not_be_overconfident(self) -> "ComplianceConclusion":
    if self.risk_level == "高" and self.confidence > 0.95:
        raise ValueError("高风险结论的置信度不应超过 0.95")
    return self</div>
<h3 class="sub">和 field_validator 对照</h3>
<table>
<tr><th></th><th>field_validator</th><th>model_validator(after)</th></tr>
<tr><td>装饰</td><td><code>@classmethod</code></td><td>实例方法 <code>self</code></td></tr>
<tr><td>时机</td><td>单字段</td><td>所有字段赋值<strong>之后</strong></td></tr>
<tr><td>典型用途</td><td>strip、去空</td><td>看两个字段组合（风险 + 置信度）</td></tr>
</table>
<div class="flow">
<span class="fbox">Field 规则</span><span class="farr">→</span>
<span class="fbox">field_validator</span><span class="farr">→</span>
<span class="fbox">建实例</span><span class="farr">→</span>
<span class="fbox">model_validator(after)</span>
</div>
<div class="call warn"><code>mode="before"</code> 处理原始 dict，进阶用；RegOps W1 只需 <code>after</code>。</div>
${checks("model_val")}
</div>`},

settings(){return `<div class="panel">
<h2 class="section">BaseSettings — 读 .env 配置</h2>
<div class="code">from pydantic_settings import BaseSettings, SettingsConfigDict

class Settings(BaseSettings):
    deepseek_api_key: str | None = None
    default_model: str = "deepseek"

    model_config = SettingsConfigDict(
        env_file=str(ROOT_DIR / ".env"),
        extra="ignore",
    )</div>
<h3 class="sub">环境变量自动映射</h3>
<table>
<tr><th>.env / 环境变量</th><th>Python 字段</th></tr>
<tr><td><code>DEEPSEEK_API_KEY=sk-...</code></td><td><code>deepseek_api_key</code></td></tr>
<tr><td><code>DEFAULT_MODEL=qwen</code></td><td><code>default_model</code></td></tr>
</table>
<p class="muted">规则：大写 + 下划线 → 小写 snake_case。优先级：<b>系统环境变量 &gt; .env 文件 &gt; 代码默认值</b>。</p>
<div class="call warn"><b>踩坑：</b><code>~/.zshrc</code> 里 <code>export DEEPSEEK_API_KEY=...</code> 会覆盖 <code>.env</code> 里新 Key。</div>
${checks("settings")}
</div>`},

fastapi(){return `<div class="panel">
<h2 class="section">和 FastAPI 怎么配合</h2>
<div class="flow">
<span class="fbox">客户端 JSON body</span><span class="farr">→</span>
<span class="fbox">FastAPI 按 ChatRequest 校验</span><span class="farr">→</span>
<span class="fbox">chat(body: ChatRequest)</span><span class="farr">→</span>
<span class="fbox">return ChatResponse → JSON</span>
</div>
<div class="code">@router.post("", response_model=ChatResponse)
async def chat(body: ChatRequest, ...) -> ChatResponse:
    ...
    return ChatResponse(reply=reply, model=settings.default_model)</div>
<table>
<tr><th>机制</th><th>作用</th></tr>
<tr><td>参数 <code>body: ChatRequest</code></td><td>自动解析 JSON；非法 → <b>422</b>，不进你的函数</td></tr>
<tr><td><code>response_model=ChatResponse</code></td><td>约束响应形状 + Swagger 文档；多写字段会被过滤</td></tr>
<tr><td><code>-> ChatResponse</code></td><td>IDE 类型提示；运行时主要靠 response_model</td></tr>
</table>
<div class="compare">
<div><h4>422 Unprocessable</h4>body 不符合 ChatRequest（如 message=""）</div>
<div><h4>502 Bad Gateway</h4>body 合法，但 LLM 调用失败（ModelError）</div>
</div>
</div>`},

error(){return `<div class="panel">
<h2 class="section">ValidationError — 校验失败</h2>
<p>任何 Field / validator 失败，Pydantic 抛 <code>pydantic.ValidationError</code>（不是普通 ValueError）。</p>
<div class="code"># 测试里（见 pytest 指南）
with pytest.raises(ValidationError):
    ComplianceConclusion(clause_refs=[], ...)

# FastAPI 里
# 自动变成 HTTP 422 + detail 列表</div>
<div class="code out">{
  "detail": [
    {"loc": ["body", "message"], "msg": "String should have at least 1 character", ...}
  ]
}</div>
<div class="call good"><b>负向测试：</b><code>test_schemas.py</code> 用 parametrize + raises，保证坏数据进不了业务逻辑。</div>
</div>`},

project(){return `<div class="panel">
<h2 class="section">对照本项目</h2>
<table>
<tr><th>文件</th><th>类</th><th>用到的 Pydantic 特性</th></tr>
<tr><td><code>schemas/chat.py</code></td><td>ChatRequest / ChatResponse</td><td>Field、默认值、FastAPI 入参出参</td></tr>
<tr><td><code>schemas/compliance.py</code></td><td>ComplianceConclusion</td><td>Literal、field_validator、model_validator</td></tr>
<tr><td><code>config.py</code></td><td>Settings</td><td>BaseSettings、env_file</td></tr>
<tr><td><code>api/chat.py</code></td><td>—</td><td>ChatRequest / ChatResponse 绑定路由</td></tr>
<tr><td><code>tests/test_schemas.py</code></td><td>—</td><td>合法 1 例 + 非法 parametrize 5 例</td></tr>
</table>
<h3 class="sub">建议阅读顺序</h3>
<ol>
<li><code>schemas/chat.py</code> — 最简单 Field</li>
<li><code>config.py</code> — Settings</li>
<li><code>schemas/compliance.py</code> — validator 全套</li>
<li><code>tests/test_schemas.py</code> — 怎么测</li>
<li><code>api/chat.py</code> — 和 FastAPI 接上</li>
</ol>
<h3 class="sub">和 W1 / 后续的关系</h3>
<p class="muted"><code>compliance.py</code> W1 只写 Schema + 测试；W6/W9 LLM 结构化输出必须符合此模型 → Java 复核。ingest 的 Financial Fact 也会是类似 Pydantic 模型（W2-2）。</p>
${checks("project")}
</div>`},

cheat(){return `<div class="panel">
<h2 class="section">速查卡</h2>
<div class="code"># ── 定义 ──
class Foo(BaseModel):
    name: str = Field(..., min_length=1)
    score: float = Field(ge=0, le=1)
    tags: list[str] = Field(default_factory=list)
    level: Literal["低", "中", "高"]

# ── 使用 ──
Foo(name="a", score=0.5)
foo.model_dump()
Foo.model_validate({"name": "a", "score": 0.5})

# ── 单字段 validator ──
@field_validator("name")
@classmethod
def strip_name(cls, v: str) -> str:
    return v.strip()

# ── 跨字段 validator ──
@model_validator(mode="after")
def check_combo(self) -> "Foo":
    ...
    return self

# ── Settings ──
class Settings(BaseSettings):
    api_key: str | None = None
    model_config = SettingsConfigDict(env_file=".env")

# ── 测试非法 ──
with pytest.raises(ValidationError):
    Foo(name="")</div>
</div>`},

practice(){return `<div class="panel">
<h2 class="section">动手练习</h2>
<div class="call warn">配合 <a href="pytest_学习指南.html">pytest 指南</a> 一起做。</div>
<h3 class="sub">练习 1：终端玩 ChatRequest</h3>
<div class="code">cd python-ai && source .venv/bin/activate
python -c "
from app.schemas.chat import ChatRequest
print(ChatRequest(message='hi', temperature=0.2))
try:
    ChatRequest(message='')
except Exception as e:
    print(type(e).__name__, e)
"</div>
<h3 class="sub">练习 2：加第 6 个非法 payload</h3>
<p>在 <code>test_schemas.py</code> 的 parametrize 里加 <code>confidence=-0.1</code>，<code>pytest tests/test_schemas.py -v</code> 应仍全绿。</p>
<h3 class="sub">练习 3：给 compliance 加 field_validator</h3>
<p>给 <code>conclusion</code> 加 validator：<code>strip()</code> 后若为空则报错。合法用例仍过，纯空格字符串应 ValidationError。</p>
<h3 class="sub">练习 4：口述（面试）</h3>
<p>30 秒讲清：field_validator 与 model_validator 区别；Settings 和 ChatRequest 分别解决什么问题。</p>
${checks("practice")}
</div>`}
};

function render(){
  if(!PAGES[route])route="start";
  document.getElementById("main").innerHTML=(PAGES[route]||PAGES.start)();
  document.getElementById("side").innerHTML=`<h2>章节</h2>${NAV.map(n=>`<button class="slink ${route===n.id?"on":""}" onclick="go('${n.id}')">${n.label}</button>`).join("")}<button class="tool" onclick="resetAll()">重置进度</button>`;
  save();
}
window.state=state;window.go=go;window.resetAll=resetAll;
window.addEventListener("hashchange",()=>{route=location.hash.slice(1)||"start";render()});
render();
</script>
</body>
</html>
