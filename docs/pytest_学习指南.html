<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pytest 学习指南 · RegOps Copilot</title>
<style>
:root{--ink:#182235;--muted:#657186;--line:#dfe5ed;--bg:#f5f7fa;--panel:#fff;--nav:#1a1a2e;--purple:#7c3aed;--purplebg:#f3e8ff;--blue:#2563eb;--bluebg:#eaf1ff;--green:#14825f;--greenbg:#e9f8f1;--amber:#a96308;--amberbg:#fff5df;--r:14px;--sh:0 10px 26px rgba(15,23,42,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--blue)}code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:.92em}
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;box-shadow:0 3px 14px #0003}.toprow{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;flex-wrap:wrap;gap:10px}
.brand b{display:block}.brand small{color:#a9b6ca;font-size:12px}
.prog{font-size:13px;color:#c9d2df}.prog b{color:#fff}
.bar{height:8px;width:120px;background:#334155;border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));transition:width .25s}
.layout{max-width:1100px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;padding:18px}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--sh)}
.side h2{font-size:13px;margin:4px 8px 8px;color:var(--muted)}.slink{display:block;width:100%;border:0;background:transparent;text-align:left;color:#46536a;border-radius:8px;padding:7px 10px;margin:2px 0;font-size:13px;cursor:pointer}.slink.on{background:var(--purplebg);color:#5b21b6;font-weight:700}.slink:hover{background:#f2f5f9}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.section{font-size:21px;margin:0 0 8px}.sub{font-size:16px;margin:16px 0 6px;font-weight:700;color:#334155}
.call{border-left:4px solid var(--purple);background:var(--purplebg);border-radius:0 10px 10px 0;padding:11px 14px;margin:10px 0}.call.good{border-color:var(--green);background:var(--greenbg)}.call.warn{border-color:var(--amber);background:var(--amberbg)}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;margin:0 4px 4px 0;background:#eef2f7;font-size:11px;font-weight:700}
.checkrow{display:grid;grid-template-columns:20px 1fr;gap:8px;margin:6px 0;padding:6px 8px;border-radius:6px}.checkrow.done label{text-decoration:line-through;color:var(--muted)}.checkrow input{margin-top:4px}
.code{font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;background:#111827;color:#e6edf7;padding:12px;border-radius:8px;font-size:13px;line-height:1.55;margin:8px 0;overflow:auto}
.code.out{background:#f8fafc;color:#334155;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--bg);font-size:12px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare>div{border:1px solid var(--line);border-radius:9px;padding:12px}.compare h4{margin:0 0 6px;font-size:14px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}.fbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff}.farr{color:#94a3b8}
.tool{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;margin-top:8px}
.muted{color:var(--muted);font-size:13px}.footer{text-align:center;font-size:12px;color:var(--muted);padding:8px 16px 20px}
@media(max-width:820px){.layout{display:block}.side{position:relative;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}.side h2{display:none}.compare{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="toprow">
  <div class="brand"><b>pytest 学习指南</b><small>从零到能测 RegOps · 结合本项目 test_*.py</small></div>
  <div class="prog">进度 <b id="pct">0%</b><div class="bar"><i id="bar" style="width:0"></i></div></div>
</div></header>
<div class="layout"><aside class="side" id="side"></aside><main id="main"></main></div>
<div class="footer">
  项目：<code>python-ai/tests/</code> ·
  <a href="pydantic_学习指南.html">Pydantic 指南</a> ·
  <a href="W1_引导式手写清单.html">W1 清单</a> ·
  <a href="面试_工程化笔记.md">面试笔记</a>
</div>
<script>
"use strict";
const KEY="pytest-guide:v1";
const state=JSON.parse(localStorage.getItem(KEY)||"{}");
const NAV=[
  {id:"start",label:"5 分钟入门"},
  {id:"run",label:"怎么运行"},
  {id:"assert",label:"assert 断言"},
  {id:"fixture",label:"fixture 准备"},
  {id:"param",label:"parametrize"},
  {id:"mark",label:"mark 标记"},
  {id:"async",label:"async 异步测试"},
  {id:"mock",label:"Mock + FastAPI"},
  {id:"project",label:"对照本项目"},
  {id:"cheat",label:"命令速查"},
  {id:"practice",label:"动手练习"}
];
const CHECKS=[
  {id:"c1",sec:"start",l:"理解：pytest 自动找 test_ 开头的函数"},
  {id:"c2",sec:"run",l:"跑通过 pytest -v"},
  {id:"c3",sec:"assert",l:"会写 assert x == y"},
  {id:"c4",sec:"fixture",l:"能解释 fixture 是测前准备"},
  {id:"c5",sec:"param",l:"能解释 parametrize 是多组输入"},
  {id:"c6",sec:"async",l:"知道 @pytest.mark.anyio 用于 async 测试"},
  {id:"c7",sec:"mock",l:"能解释 dependency_overrides 换假 LLM"},
  {id:"c8",sec:"project",l:"读过 tests/test_api.py 全文"},
  {id:"c9",sec:"practice",l:"完成练习 1：故意写错 assert 看 FAILED"}
];
let route=location.hash.slice(1)||"start";

function save(){localStorage.setItem(KEY,JSON.stringify(state));const n=CHECKS.filter(c=>state[c.id]).length;const p=Math.round(n/CHECKS.length*100);document.getElementById("pct").textContent=p+"%";document.getElementById("bar").style.width=p+"%"}
function chk(id,l){const d=!!state[id];return `<div class="checkrow ${d?"done":""}"><input type="checkbox" ${d?"checked":""} onchange="state['${id}']=this.checked;save();render()"><label>${l}</label></div>`}
function checks(sec){return CHECKS.filter(c=>c.sec===sec).map(c=>chk(c.id,c.l)).join("")}
function go(id){route=id;location.hash=id;render()}
function resetAll(){if(confirm("清除勾选？")){Object.keys(state).forEach(k=>delete state[k]);save();render()}}

const PAGES={
start(){return `<div class="panel">
<h2 class="section">pytest 是什么？</h2>
<div class="call good"><b>一句话：</b>pytest 是 Python 的测试_runner_——自动找到 <code>test_*.py</code> 里的 <code>test_xxx</code> 函数，执行并告诉你通过还是失败。</div>
<div class="compare">
<div><h4>没有 pytest</h4><p class="muted">改完代码 → 手动 curl → 肉眼对结果 → 容易忘、不能一键回归</p></div>
<div><h4>有 pytest</h4><p class="muted">改完代码 → 终端 <code>pytest -v</code> → 17 passed → 放心提交</p></div>
</div>
<h3 class="sub">最小测试长什么样</h3>
<div class="code"># tests/test_demo.py
def test_one_plus_one():
    assert 1 + 1 == 2</div>
<div class="code"># 终端
cd python-ai
pytest tests/test_demo.py -v</div>
<div class="code out">tests/test_demo.py::test_one_plus_one PASSED</div>
${checks("start")}
</div>`},

run(){return `<div class="panel">
<h2 class="section">怎么运行（你项目里常用）</h2>
<table>
<tr><th>命令</th><th>干什么</th></tr>
<tr><td><code>pytest -v</code></td><td>跑 tests/ 下全部测试，显示每条 PASS/FAIL</td></tr>
<tr><td><code>pytest tests/test_api.py -v</code></td><td>只跑 API 测试</td></tr>
<tr><td><code>pytest tests/test_schemas.py::test_valid_compliance_conclusion -v</code></td><td>只跑某一个函数</td></tr>
<tr><td><code>pytest -k "chat" -v</code></td><td>名字里含 chat 的测试</td></tr>
<tr><td><code>pytest --tb=short</code></td><td>失败时缩短报错栈</td></tr>
</table>
<h3 class="sub">报告怎么读</h3>
<div class="code out">collected 17 items
tests/test_api.py::test_health PASSED           [  5%]
...
17 passed in 0.16s</div>
<ul class="muted">
<li><code>collected 17 items</code> — 找到 17 个测试</li>
<li><code>PASSED</code> — 通过；<code>FAILED</code> — 失败（下面会有红色原因）</li>
<li><code>[payload0]</code> — parametrize 的第 0 组参数</li>
</ul>
<h3 class="sub">pytest.ini（本项目）</h3>
<div class="code">[pytest]
pythonpath = .      # 让 from app.xxx 能导入
testpaths = tests   # 只扫 tests 目录
asyncio_mode = auto</div>
${checks("run")}
</div>`},

assert(){return `<div class="panel">
<h2 class="section">assert — 测试的核心</h2>
<p><code>assert 条件</code>：条件为真 → 通过；为假 → 测试 <b>FAILED</b>。</p>
<div class="code">def test_chat_result_total_tokens():
    result = ChatResult(content="hi", prompt_tokens=10, completion_tokens=5)
    assert result.total_tokens == 15   # 期望 15</div>
<div class="compare">
<div><h4>✅ 通过</h4><code>assert 15 == 15</code></div>
<div><h4>❌ 失败</h4><code>assert 15 == 16</code> → pytest 打印两边差在哪</div>
</div>
<h3 class="sub">测「应该报错」</h3>
<div class="code">import pytest
from pydantic import ValidationError

def test_bad_data():
    with pytest.raises(ValidationError):   # 期望这里抛异常
        ComplianceConclusion(clause_refs=[], ...)  # 非法</div>
<p class="muted">你项目 <code>test_schemas.py</code> 里大量用这种写法。</p>
${checks("assert")}
</div>`},

fixture(){return `<div class="panel">
<h2 class="section">@pytest.fixture — 测前准备</h2>
<div class="call"><b>比喻：</b>考试前统一发答题卡。多个测试共用，不用复制粘贴。</div>
<div class="code">@pytest.fixture
def apple():
    return "🍎"

def test_eat(apple):       # 参数名必须叫 apple
    assert apple == "🍎"</div>
<div class="flow">
<span class="fbox">pytest 开始 test_eat</span><span class="farr">→</span>
<span class="fbox">先跑 apple()</span><span class="farr">→</span>
<span class="fbox">返回值传给 test_eat</span>
</div>
<h3 class="sub">yield = 准备 + 测完收拾</h3>
<div class="code">@pytest.fixture
async def client():
    app.dependency_overrides[...] = lambda: FakeLLMClient()  # ① 准备
    async with AsyncClient(...) as ac:
        yield ac          # ② 交给测试用
    app.dependency_overrides.clear()  # ③ 测试后清理</div>
<table>
<tr><th>词</th><th>意思</th></tr>
<tr><td><code>yield ac</code></td><td>把 ac 给测试；测完执行 yield 后面</td></tr>
<tr><td><code>return</code></td><td>只给东西，不收尾</td></tr>
</table>
${checks("fixture")}
</div>`},

param(){return `<div class="panel">
<h2 class="section">@pytest.mark.parametrize — 多组输入</h2>
<div class="call"><b>一句话：</b>同一测试逻辑，换多份数据，自动跑多遍。</div>
<div class="code">@pytest.mark.parametrize("payload", [
    {"clause_refs": [], ...},      # 第 0 组 → [payload0]
    {"risk_level": "未知", ...},   # 第 1 组 → [payload1]
])
def test_invalid(payload):
    with pytest.raises(ValidationError):
        ComplianceConclusion(**payload)</div>
<div class="compare">
<div><h4>不用 parametrize</h4>写 5 个几乎一样的 test 函数</div>
<div><h4>用 parametrize</h4>1 个函数 + 列表里加一行 dict</div>
</div>
<p class="muted">见 <code>tests/test_schemas.py</code></p>
${checks("param")}
</div>`},

mark(){return `<div class="panel">
<h2 class="section">@pytest.mark — 给测试贴标签</h2>
<table>
<tr><th>标记</th><th>用途</th><th>本项目</th></tr>
<tr><td><code>@pytest.mark.anyio</code></td><td>async 测试，能 await</td><td>test_api.py</td></tr>
<tr><td><code>@pytest.mark.parametrize</code></td><td>多组参数</td><td>test_schemas.py</td></tr>
<tr><td><code>@pytest.mark.skip</code></td><td>跳过不测</td><td>暂未用</td></tr>
<tr><td><code>@pytest.fixture</code></td><td>不是 mark，是准备函数</td><td>client fixture</td></tr>
</table>
<div class="call warn"><code>@pytest.fixture</code> 和 <code>@pytest.mark.xxx</code> 不一样：fixture 是「准备函数」，mark 是「贴在该测试上的标签」。</div>
</div>`},

async(){return `<div class="panel">
<h2 class="section">异步测试 async / await</h2>
<p>FastAPI 路由是 <code>async def</code>，测 API 也要 async：</p>
<div class="code">@pytest.mark.anyio
async def test_health(client):
    response = await client.get("/health")   # 必须 await
    assert response.status_code == 200</div>
<div class="code">@pytest.fixture
def anyio_backend():
    return "asyncio"   # 用 asyncio，不用 trio</div>
<p class="muted">没有 <code>@pytest.mark.anyio</code>，<code>async def test_</code> 跑不起来。</p>
${checks("async")}
</div>`},

mock(){return `<div class="panel">
<h2 class="section">Mock + FastAPI（最重要的一块）</h2>
<div class="call good"><b>目标：</b>测 /chat 接口逻辑，<b>不</b>真打 DeepSeek。</div>
<h3 class="sub">三步理解</h3>
<div class="flow">
<span class="fbox">① FakeLLMClient<br>假模型，固定回复</span>
<span class="farr">→</span>
<span class="fbox">② dependency_overrides<br>告诉 FastAPI 换假的</span>
<span class="farr">→</span>
<span class="fbox">③ AsyncClient<br>内存里 POST /chat</span>
</div>
<div class="code">class FakeLLMClient(LLMClient):
    async def chat(self, messages, **kw):
        return "这是 mock 回复"

app.dependency_overrides[get_llm_client_dep] = lambda: FakeLLMClient()</div>
<h3 class="sub">为什么要 Depends（复习）</h3>
<p>路由里写 <code>Depends(get_llm_client_dep)</code>，override 才能替换。若在函数里直接 <code>get_llm_client()</code>，测试换不掉。</p>
<div class="compare">
<div><h4>pytest</h4>Mock LLM，断网，快，CI 友好</div>
<div><h4>curl</h4>真 API，验证 Key 和网络</div>
</div>
${checks("mock")}
</div>`},

project(){return `<div class="panel">
<h2 class="section">对照本项目 4 个测试文件</h2>
<table>
<tr><th>文件</th><th>测什么</th><th>用到的 pytest 特性</th></tr>
<tr><td><code>test_config.py</code></td><td>.env 路径、Key 加载</td><td>普通 assert</td></tr>
<tr><td><code>test_models_base.py</code></td><td>ChatResult、抽象类</td><td>assert + pytest.raises(TypeError)</td></tr>
<tr><td><code>test_schemas.py</code></td><td>合规 DTO 合法/非法</td><td>parametrize + raises(ValidationError)</td></tr>
<tr><td><code>test_api.py</code></td><td>/health /chat /models</td><td>fixture + anyio + dependency_overrides</td></tr>
</table>
<h3 class="sub">建议阅读顺序</h3>
<ol>
<li><code>test_config.py</code> — 最简单</li>
<li><code>test_models_base.py</code></li>
<li><code>test_schemas.py</code> — 学 parametrize</li>
<li><code>test_api.py</code> — 学 fixture + Mock</li>
</ol>
${checks("project")}
</div>`},

cheat(){return `<div class="panel">
<h2 class="section">命令 & 装饰器速查卡</h2>
<div class="code"># ── 命令 ──
pytest -v
pytest tests/test_api.py -v
pytest -k chat -v
pytest --tb=short

# ── 最小测试 ──
def test_xxx():
    assert 表达式

# ── 期望报错 ──
with pytest.raises(SomeError):
    会出错的代码()

# ── 多组数据 ──
@pytest.mark.parametrize("x", [1, 2, 3])
def test_xxx(x): ...

# ── 测前准备 ──
@pytest.fixture
def name():
    return 东西
def test_xxx(name): ...

# ── 异步 ──
@pytest.mark.anyio
async def test_xxx():
    await ...</div>
</div>`},

practice(){return `<div class="panel">
<h2 class="section">动手练习（在 python-ai 里做）</h2>
<div class="call warn">练习比看文档重要。每题 5–10 分钟。</div>
<h3 class="sub">练习 1：故意失败</h3>
<p>改 <code>test_config.py</code> 里某 assert 为 <code>assert False</code>，跑 pytest，看 FAILED 红色输出，再改回。</p>
<h3 class="sub">练习 2：加一个 parametrize</h3>
<p>在 <code>test_schemas.py</code> 加第 6 个非法 payload（如 confidence=-0.1），跑 pytest 应 6 条 invalid 全过。</p>
<h3 class="sub">练习 3：新写一个 test</h3>
<div class="code"># tests/test_demo.py
def test_root_message():
    from app.main import app
    # 提示：可用 TestClient 或抄 test_api 的 AsyncClient 写法</div>
<h3 class="sub">练习 4：口述</h3>
<p>不看书解释：fixture、parametrize、dependency_overrides 各一句话。</p>
${checks("practice")}
</div>`}
};

function render(){
  if(!PAGES[route])route="start";
  document.getElementById("main").innerHTML=(PAGES[route]||PAGES.start)();
  document.getElementById("side").innerHTML=`<h2>章节</h2>${NAV.map(n=>`<button class="slink ${route===n.id?"on":""}" onclick="go('${n.id}')">${n.label}</button>`).join("")}<button class="tool" onclick="resetAll()">重置进度</button>`;
  save();
}
window.state=state;window.go=go;window.resetAll=resetAll;
window.addEventListener("hashchange",()=>{route=location.hash.slice(1)||"start";render()});
render();
</script>
</body>
</html>
