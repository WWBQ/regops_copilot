[project]
name = "financial-risk-audit-assistant"
version = "0.1.0"
description = "金融风险审计助手：公开财报风险线索初筛与人工复核"
requires-python = ">=3.14"
dependencies = [
  "deepagents==0.6.11",
  "langchain==1.4.1",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "langchain-openai==1.6.2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "python-dotenv==1.2.3",
  "requests==2.34.2",
  "zhipuai==2.1.5.20250825",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
