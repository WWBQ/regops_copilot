# DEMO ONLY。与 .env.example 默认值一致，方便 kind / minikube 直接 apply。
# 生产用 sealed-secret / 外部密钥，不要把真实 Key 写进 Git。
# 本地覆盖：复制为 secret.local.yaml 后改，再 kubectl apply -f（已 gitignore）。
apiVersion: v1
kind: Secret
metadata:
  name: regops-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "regops123"
  DATABASE_URL: "postgresql://regops:regops123@postgres:5432/regops_db"
  REGOPS_JWT_SECRET: "dev-regops-jwt-secret-change-me-32b"
  REGOPS_SERVICE_TOKEN: "dev-service-token"
  DEEPSEEK_API_KEY: ""
  QWEN_API_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
