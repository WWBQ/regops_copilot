# kind create cluster --name regops --config k8s/kind-config.yaml
# 把 NodePort 映射到本机，避免再记 30088。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30088
        hostPort: 8088
        protocol: TCP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
