apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-service
  labels:
    app: java-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-service
  template:
    metadata:
      labels:
        app: java-service
    spec:
      initContainers:
        - name: wait-db
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          command:
            [
              "sh",
              "-c",
              "until pg_isready -h postgres -U regops -d regops_db; do sleep 2; done",
            ]
      containers:
        - name: java-service
          image: regops/java-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: regops-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: regops-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: regops-secrets
                  key: POSTGRES_PASSWORD
            - name: REGOPS_PYTHON_AI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: regops-config
                  key: REGOPS_PYTHON_AI_BASE_URL
            - name: REGOPS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: regops-secrets
                  key: REGOPS_JWT_SECRET
            - name: REGOPS_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: regops-secrets
                  key: REGOPS_SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: java-service
  labels:
    app: java-service
spec:
  type: NodePort
  selector:
    app: java-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
