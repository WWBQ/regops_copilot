# SQL 与 Compose 挂载的 docs/sql 同内容。Kustomize 不能引用本目录外的文件。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: regops
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - python-ai.yaml
  - java-service.yaml
  - web.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - 01_init.sql=init/01_init.sql
      - 02_w2_tables.sql=init/02_w2_tables.sql
      - 03_w3_sessions.sql=init/03_w3_sessions.sql
      - 04_w4_rag_log.sql=init/04_w4_rag_log.sql
      - 05_asknum_log.sql=init/05_asknum_log.sql
      - 06_asknum_alias.sql=init/06_asknum_alias.sql
      - 07_review_draft.sql=init/07_review_draft.sql
      - 08_w7_identity.sql=init/08_w7_identity.sql
generatorOptions:
  disableNameSuffixHash: true
