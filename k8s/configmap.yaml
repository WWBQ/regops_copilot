# 非密钥配置。密钥见 secret.yaml。
apiVersion: v1
kind: ConfigMap
metadata:
  name: regops-config
data:
  POSTGRES_USER: "regops"
  POSTGRES_DB: "regops_db"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/regops_db"
  SPRING_DATASOURCE_USERNAME: "regops"
  REGOPS_PYTHON_AI_BASE_URL: "http://python-ai:8000"
  DEFAULT_MODEL: "deepseek"
  API_PUBLIC_BASE_URL: "http://python-ai:8000"
  OBJECT_STORE_ROOT: "/app/data/objects"
  CHECKPOINT_SQLITE_PATH: "/app/data/checkpoints/review.sqlite"
  LABELING_DATA_DIR: "/app/data/labeling"
  HF_HOME: "/app/data/hf"
  LANGFUSE_HOST: "https://cloud.langfuse.com"
