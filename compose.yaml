services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: regops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regops123}
      POSTGRES_DB: regops_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docs/sql/init_pgvector.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./docs/sql/w2_tables.sql:/docker-entrypoint-initdb.d/02_w2_tables.sql:ro
      - ./docs/sql/w3_chat_sessions.sql:/docker-entrypoint-initdb.d/03_w3_sessions.sql:ro
      - ./docs/sql/w4_rag_query_log.sql:/docker-entrypoint-initdb.d/04_w4_rag_log.sql:ro
      - ./docs/sql/w4_asknum_query_log.sql:/docker-entrypoint-initdb.d/05_asknum_log.sql:ro
      - ./docs/sql/w4_asknum_alias.sql:/docker-entrypoint-initdb.d/06_asknum_alias.sql:ro
      - ./docs/sql/w4_asknum_pending.sql:/docker-entrypoint-initdb.d/06b_asknum_pending.sql:ro
      - ./docs/sql/w7_identity.sql:/docker-entrypoint-initdb.d/08_w7_identity.sql:ro
      - ./docs/sql/w10_storage_unification.sql:/docker-entrypoint-initdb.d/09_storage_unification.sql:ro
      - ./docs/sql/w11_chat_history.sql:/docker-entrypoint-initdb.d/10_chat_history.sql:ro
      - ./docs/sql/w12_trace_ownership.sql:/docker-entrypoint-initdb.d/11_trace_ownership.sql:ro
      - ./docs/sql/w13_ingest_batches.sql:/docker-entrypoint-initdb.d/12_ingest_batches.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regops -d regops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-ai:
    build:
      context: .
      dockerfile: python-ai/Dockerfile
    container_name: regops-python
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://regops:${POSTGRES_PASSWORD:-regops123}@db:5432/regops_db
      REGOPS_SERVICE_TOKEN: ${REGOPS_SERVICE_TOKEN:-dev-service-token}
      OBJECT_STORE_ROOT: /app/data/objects
      LABELING_DATA_DIR: /app/data/labeling
      HF_HOME: /app/data/hf
      API_PUBLIC_BASE_URL: http://localhost:8000
      INGEST_BROKER_URL: amqp://regops:${RABBITMQ_PASSWORD:-regops}@rabbitmq:5672//
      INGEST_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - python_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: regops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: regops-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: regops
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-regops}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  ingest-worker:
    build:
      context: .
      dockerfile: python-ai/Dockerfile
    container_name: regops-ingest-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.ingest.tasks:celery_app", "worker", "--loglevel=INFO", "--pool=solo", "--concurrency=1", "--queues=ingest"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://regops:${POSTGRES_PASSWORD:-regops123}@db:5432/regops_db
      INGEST_BROKER_URL: amqp://regops:${RABBITMQ_PASSWORD:-regops}@rabbitmq:5672//
      INGEST_RESULT_BACKEND: redis://redis:6379/1
      OBJECT_STORE_ROOT: /app/data/objects
      LABELING_DATA_DIR: /app/data/labeling
      HF_HOME: /app/data/hf
      HF_HUB_OFFLINE: "1"
    volumes:
      - python_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: regops-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-searxng-secret-change-me}
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro

  risk-agent:
    build: ./financial-risk-audit-assistant
    container_name: regops-risk-agent
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - path: .env
        required: false
    environment:
      REGOPS_SERVICE_TOKEN: ${REGOPS_SERVICE_TOKEN:-dev-service-token}
      AGENT_DATABASE_URL: postgresql://regops:${POSTGRES_PASSWORD:-regops123}@db:5432/regops_db
      FIN_RISK_AUDIT_DATA_DIR: /app/data
      REGOPS_MCP_URL: http://python-ai:8000/mcp/
      FIN_RISK_AUDIT_LOG_DIR: /app/data/logs
      AI_WORKSPACE_ROOT: /app/workspace
      SEARXNG_BASE_URL: http://searxng:8080
    volumes:
      - risk_agent_data:/app/data
      - risk_agent_workspace:/app/workspace
    depends_on:
      python-ai:
        condition: service_healthy
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2024/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  java-service:
    build: ./java-service
    container_name: regops-java
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/regops_db
      SPRING_DATASOURCE_USERNAME: regops
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-regops123}
      REGOPS_PYTHON_AI_BASE_URL: http://python-ai:8000
      REGOPS_RISK_AGENT_BASE_URL: http://risk-agent:2024
      REGOPS_JWT_SECRET: ${REGOPS_JWT_SECRET:-dev-regops-jwt-secret-change-me-32b}
      REGOPS_SERVICE_TOKEN: ${REGOPS_SERVICE_TOKEN:-dev-service-token}
    depends_on:
      db:
        condition: service_healthy
      risk-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s

  web:
    build: ./web
    container_name: regops-web
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      java-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  python_data:
  risk_agent_data:
  risk_agent_workspace:
  redis_data:
  rabbitmq_data:
