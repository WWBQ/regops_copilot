services:
  db:
    image: pgvector/pgvector:pg16
    container_name: regops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: regops
      POSTGRES_PASSWORD: regops123
      POSTGRES_DB: regops_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docs/sql/init_pgvector.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./docs/sql/w2_tables.sql:/docker-entrypoint-initdb.d/02_w2_tables.sql:ro
      - ./docs/sql/w3_chat_sessions.sql:/docker-entrypoint-initdb.d/03_w3_sessions.sql:ro
      - ./docs/sql/w4_rag_query_log.sql:/docker-entrypoint-initdb.d/04_w4_rag_log.sql:ro
      - ./docs/sql/w4_asknum_query_log.sql:/docker-entrypoint-initdb.d/05_asknum_log.sql:ro
      - ./docs/sql/w4_asknum_alias.sql:/docker-entrypoint-initdb.d/06_asknum_alias.sql:ro
      - ./docs/sql/w6_review_draft.sql:/docker-entrypoint-initdb.d/07_review_draft.sql:ro
      - ./docs/sql/w7_identity.sql:/docker-entrypoint-initdb.d/08_w7_identity.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regops -d regops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  java-service:
    build: ./java-service
    container_name: regops-java
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/regops_db
      SPRING_DATASOURCE_USERNAME: regops
      SPRING_DATASOURCE_PASSWORD: regops123
      REGOPS_PYTHON_AI_BASE_URL: http://host.docker.internal:8000
      REGOPS_JWT_SECRET: ${REGOPS_JWT_SECRET:-dev-regops-jwt-secret-change-me-32b}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
