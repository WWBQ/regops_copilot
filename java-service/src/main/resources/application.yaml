server:
  port: 8080

spring:
  application:
    name: java-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/regops_db}
    username: ${SPRING_DATASOURCE_USERNAME:regops}
    password: ${SPRING_DATASOURCE_PASSWORD:regops123}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    async:
      request-timeout: 180000

regops:
  python-ai:
    base-url: ${REGOPS_PYTHON_AI_BASE_URL:http://localhost:8000}
    # 超时预算：建连 5s / 读 120s / 流式 ≥180s / 探活 2.5s。读路径 5xx 最多再试 2 次，超时不重试。
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
    stream-timeout-ms: 180000
    health-timeout-ms: 2500
    service-name: java-service
    service-token: ${REGOPS_SERVICE_TOKEN:dev-service-token}
    read-retry-count: 2
  auth:
    jwt-secret: ${REGOPS_JWT_SECRET:dev-regops-jwt-secret-change-me-32b}
    jwt-ttl-seconds: 28800
    seed: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-},%X{traceId:-}]"
